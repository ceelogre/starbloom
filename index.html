<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfaf5" />
    <title>Starbloom — Meat Orders</title>
    <script>
      // Applies the stored appearance before first paint. Key must match
      // src/theme/theme-context.ts.
      ;(function () {
        try {
          var preference = localStorage.getItem('starbloom.color-mode')
          if (preference !== 'light' && preference !== 'dark') {
            preference = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.dataset.mode = preference
        } catch (error) {
          /* Fall back to the attribute already on <html>. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
